# main에 들어오면 테스트 → Firebase 호스팅 배포 (https://<사이트>.web.app)
# 저장소 Secrets: VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID, VITE_FIREBASE_APP_ID,
#                 VITE_RECAPTCHA_SITE_KEY, FIREBASE_SERVICE_ACCOUNT_…(npx firebase-tools init hosting:github 이 만듦)
name: 배포 (Firebase 호스팅)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_AI_MODE: gemini
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
  VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 설정값 확인
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          missing=""
          for k in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID VITE_RECAPTCHA_SITE_KEY; do
            if [ -z "${!k}" ]; then missing="$missing $k"; fi
          done
          sa=$(echo "$ALL_SECRETS" | jq -r 'to_entries | map(select(.key | startswith("FIREBASE_SERVICE_ACCOUNT"))) | first | .value // empty')
          if [ -z "$sa" ]; then missing="$missing FIREBASE_SERVICE_ACCOUNT_…(npx firebase-tools init hosting:github)"; fi
          if [ -n "$missing" ]; then
            echo "::error::저장소 Settings › Secrets and variables › Actions에 다음 값을 넣어 주세요:$missing"
            exit 1
          fi
          { echo "FIREBASE_SA<<__SA_EOF__"; echo "$sa"; echo "__SA_EOF__"; } >> "$GITHUB_ENV"
      - run: npm ci
      - name: 단위 테스트
        run: npm test
      - name: Firebase 호스팅 배포 (빌드는 firebase.json predeploy가 함)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SA }}
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          target: ant
          channelId: live
